################################################################################
# pytest
################################################################################

[tool.pytest.ini_options]
addopts = "--continue-on-collection-errors --tb=short --durations=30"
markers = [
    "acceptance: Marks tests as acceptance tests",
    "component: Mark tests as component tests",
    "unit: Marks tests as unit tests",
]
python_files = [
    # Only collect files in a (sub)directory of "tests/pytest" to avoid
    # collecting legacy unittest acceptance tests.
    "tests/pytest/test*.py",
    "tests/pytest/*/test*.py",
]
testpaths = [
    "tests/pytest/",
]
# pytest-django
DJANGO_SETTINGS_MODULE = "coldfront.config.settings"

################################################################################
# coverage.py
################################################################################

[tool.coverage.run]
source = ["coldfront"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "coldfront/config/*",
    "*/.venv/*",
    "*/conftest.py",
]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
