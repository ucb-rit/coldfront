################################################################################
# pytest
################################################################################

[tool.pytest.ini_options]
addopts = "--continue-on-collection-errors --tb=short --durations=30 --timeout=30"
markers = [
    "acceptance: Marks tests as acceptance tests",
    "component: Mark tests as component tests",
    "unit: Marks tests as unit tests",
]
python_files = [
    # Only collect files in a (sub)directory of "tests/pytest" to avoid
    # collecting legacy unittest acceptance tests.
    "tests/pytest/test*.py",
    "tests/pytest/*/test*.py",
]
testpaths = [
    "tests/pytest/",
]
# pytest-django
DJANGO_SETTINGS_MODULE = "coldfront.config.settings"

################################################################################
# coverage.py
################################################################################

[tool.coverage.run]
source = ["coldfront"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "coldfront/config/*",
    "*/.venv/*",
    "*/conftest.py",
]
branch = true
relative_files = true

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 50

################################################################################
# ruff
################################################################################

[tool.ruff]
line-length = 88
exclude = [".venv/", "*/migrations/*", ".git/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "E501",    # line-too-long — formatter handles this
    "DJ001",   # null=True on string fields — existing models use this pattern
    "RUF012",  # mutable class attributes — standard Django/DRF pattern (Meta.fields, queryset, etc.)
    "B026",    # star-arg after keyword — Django ORM filter(*Q_args, **kwargs) pattern
]

[tool.ruff.lint.per-file-ignores]
# apps.py ready() uses bare side-effect imports to connect Django signals
"*/apps.py" = ["F401"]
# settings.py uses the Django local_settings star-import convention
"*/config/settings.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["coldfront"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
