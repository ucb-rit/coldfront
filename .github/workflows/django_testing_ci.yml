# Github Actions workflow that runs the test suite on the master branch
# every night, as well as tests new pull requests.

name: Django Testing CI

on:
  schedule: # Run every night at 3 AM
    - cron: '0 10 * * *' # 10 AM UTC = 3 AM PST
  push: # Run when pushes are made on the master and develop branch
    branches: [ "master", "develop" ]
  pull_request: # Runs when pull request to develop or master is opened,
                # reopened, or updated with a new commit.
    branches: [ "master", "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─── Overview ────────────────────────────────────────────────────────────────
  #
  # All tests (Django TestCase acceptance tests and pytest unit/component
  # tests) run under pytest in one matrix job, split into groups:
  #
  # - pytest-split assigns each group a share of the suite, balanced using
  #   the committed .test_durations file. duration_based_chunks keeps
  #   neighbouring tests together, so a TestCase class mostly lands in one
  #   group and its setUpClass runs once. Tests missing from the durations
  #   file get the average duration.
  # - pytest-xdist runs each group on one worker per core (-n auto; 4 on
  #   standard runners for public repos), each with its own test database.
  #   --dist loadscope keeps a class's tests on one worker.
  # - pytest-randomly is disabled: the Django suite has never run shuffled,
  #   and pytest-django must order TransactionTestCase classes (which flush
  #   the database) after the rest.
  #
  # Refreshing durations: each group uploads the durations of the tests it
  # ran (--store-durations --clean-durations writes only those). Download
  # the test-durations-* artifacts from a run on develop, merge them with
  # `jq -s add test-durations-*/.test_durations > .test_durations`, and
  # commit the result.
  #
  # Coverage: pytest-cov combines worker data into .coverage, which each group
  # renames to coverage-test-<group> (no leading dot: upload-artifact skips
  # dotfiles) and uploads. The `report` job combines all groups.
  #
  # Shared setup (checkout, Python, venv, settings) lives in the composite
  # action at .github/actions/coldfront-setup.  Each job still declares its
  # own Postgres service because services cannot be defined in composite actions.
  #
  # ─────────────────────────────────────────────────────────────────────────────

  lint:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Check formatting
        run: ruff format --check coldfront/

      - name: Lint
        # --exit-zero: advisory until the existing violations are resolved;
        # remove this flag once the codebase is clean.
        run: ruff check --output-format github --exit-zero coldfront/

      # Test directories must be packages. `manage.py test` discovery skips
      # directories without __init__.py, and pytest imports test modules in
      # them by bare filename, so same-named modules in different directories
      # collide. Fail if any test*.py (outside tests/pytest/ dirs) has a
      # non-package ancestor.
      - name: Check test modules are discoverable
        run: |
          missing=$(
            find coldfront -name 'test*.py' -not -path '*/pytest/*' -print0 \
              | xargs -0 -n1 dirname | sort -u \
              | while read -r d; do
                  p=$d
                  while [ "$p" != "coldfront" ]; do
                    [ -f "$p/__init__.py" ] || echo "$p"
                    p=$(dirname "$p")
                  done
                done | sort -u
          )
          if [ -n "$missing" ]; then
            echo "::error::Test directories missing __init__.py (tests there never run):"
            echo "$missing"
            exit 1
          fi

  # ─── Tests ───────────────────────────────────────────────────────────────────
  # Keep the group count in step with --splits and with the report job's
  # expected coverage file count.

  test:
    name: test (${{ matrix.group }}/3)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]

    services:
      postgres:
        image: postgres:15.2-alpine3.17
        env:
          POSTGRES_DB: cf_brc_db
          POSTGRES_PASSWORD: test
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/coldfront-setup

      - name: Run tests
        run: |
          source ~/venv/bin/activate
          export django_secret_key=`openssl rand -base64 64`
          pytest coldfront/ \
            -p no:randomly \
            -n auto --dist loadscope \
            --splits 3 --group ${{ matrix.group }} \
            --splitting-algorithm duration_based_chunks \
            --store-durations --clean-durations \
            --cov --cov-report=

      - name: Rename coverage data
        if: always()
        run: mv .coverage coverage-test-${{ matrix.group }} || true

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-test-${{ matrix.group }}
          path: coverage-test-${{ matrix.group }}
        if: always()

      - name: Upload test durations
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ matrix.group }}
          path: .test_durations
          include-hidden-files: true
        if: always()

  # ─── Report ──────────────────────────────────────────────────────────────────
  # Runs after all test groups (even if one fails) to combine coverage data,
  # post the PR comment, and upload the combined report artifact.

  report:
    needs: [test]
    if: always()
    runs-on: ubuntu-22.04

    permissions:
      contents: write  # required to push python-coverage-comment-action-data branch
      pull-requests: write  # required to post coverage comment

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/coldfront-setup

      - name: Download all coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data

      # A test job that fails to produce coverage only warns at upload
      # ("No files were found"), and the report would silently combine fewer
      # groups. Fail instead. Keep the count in step with the test matrix.
      - name: Check all coverage data arrived
        run: |
          expected=3
          found=$(ls coverage-data/coverage-* 2>/dev/null | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::Expected $expected coverage files, found $found:"
            ls coverage-data/ || true
            exit 1
          fi

      - name: Generate combined coverage report
        run: |
          source ~/venv/bin/activate
          coverage combine coverage-data/coverage-*
          coverage html
          coverage xml -o coverage-combined.xml
          coverage report --fail-under=50

      - name: Post coverage comment on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-*.xml
            htmlcov/
          retention-days: 7
        if: always()
