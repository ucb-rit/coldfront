###############################################################################
# lrc-prod: LRC production server
# Inherits from group_vars/all and group_vars/lrc.
###############################################################################

debug: False
app_user: root
app_root: /var/www/coldfront_app

#------------------------------------------------------------------------------
# Host
#------------------------------------------------------------------------------

hostname: mylrc.lbl.gov
host_ip: 131.243.8.12
site_url: https://mylrc.lbl.gov
ssl_enabled: true
cloudflare_enabled: true
cloudflare_local_server_name: mylrc-local.lbl.gov
cloudflare_ip_ranges:
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 108.162.192.0/18
  - 131.0.72.0/22
  - 141.101.64.0/18
  - 162.158.0.0/15
  - 172.64.0.0/13
  - 173.245.48.0/20
  - 188.114.96.0/20
  - 190.93.240.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
ssl_certificate_file: /etc/ssl/dummy/mylrc-local.lbl.gov_cert.crt
ssl_certificate_key_file: /etc/ssl/dummy/mylrc-local.lbl.gov_cert.key
ssl_certificate_chain_file: ""

#------------------------------------------------------------------------------
# Email
#------------------------------------------------------------------------------

email_backend: django.core.mail.backends.smtp.EmailBackend
email_host: smtp-relay.gmail.com
email_port: 587
email_use_tls: true

#------------------------------------------------------------------------------
# LRC billing validation
#------------------------------------------------------------------------------

install_billing_validation_package: true

#------------------------------------------------------------------------------
# Renewal surveys (google_forms)
#------------------------------------------------------------------------------

renewal_survey_backend: google_forms
renewal_survey_google_forms_survey_data_cache_key: renewal_survey_google_forms_survey_data
