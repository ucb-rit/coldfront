---
# Set up MOU generation assets. Called from deploy.yml when flag_brc_enabled=true.

- name: Ensure MOU files directory exists
  file:
    path: "{{ savio_mou_director_signature_path | dirname }}"
    state: directory
    owner: "{{ app_user }}"
    group: apache
    mode: 0750

- name: Write MOU director signature file
  copy:
    content: "{{ vault_savio_mou_director_signature_b64 | b64decode }}"
    dest: "{{ savio_mou_director_signature_path }}"
    owner: "{{ app_user }}"
    group: apache
    mode: 0640
  when: vault_savio_mou_director_signature_b64 is defined
  no_log: true
