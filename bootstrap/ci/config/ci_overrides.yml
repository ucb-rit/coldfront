# =============================================================================
# CI Testing Configuration Overrides
# =============================================================================

# Database and service hosts for CI environment (running on localhost)
db_host: localhost
email_backend: django.core.mail.backends.dummy.EmailBackend
email_host: localhost
redis_host: localhost

# Database credentials for CI (matches postgres service in workflow)
db_admin_user: test
db_admin_passwd: test

stream_logs_to_stdout: true

# Use dummy cache backend for testing (no Redis required)
django_cache_backend_short: dummy

# Disable django-constance (no Redis required)
django_constance_enabled: false

# Use synchronous job queue mode for testing (no Redis required)
django_q_job_queue_mode: sync

# Use the dummy backend for the departments plugin
plugin_departments_department_data_source: "coldfront.plugins.departments.utils.data_sources.backends.dummy.DummyDataSourceBackend"

# MOU generation: use the bundled sample signature (path relative to repo root,
# which is the working directory for all CI test runs).
savio_mou_director_signature_path: "coldfront/lib/brc_mou_generator/static/sample_director_signature.png"
